# Character bible for the whole film.
#
# slot  : the Extender <Picture N> slot this character always uses (1-9, unique).
#         Keep 7 for locations, 8 for a scene's group plate, 9 as a per-clip spare.
# look  : a noun phrase used the first time the character appears in a clip.
#         Make the six looks easy to tell apart: hair colour/length, one strong
#         costume colour, one accessory. Identical wording every time.
# short : a shorter noun phrase for later mentions in the same clip.
# sheet : character sheet image (e.g. Qwen Image 2.1 character design sheet).
# face  : face close-up. face_check.py uses it; `ref: face` also sends it to H3.
# voice : 2-15 s voice sample, used as <Audio N> when the character speaks.
# Paths are relative to this file.

characters:
  - id: A
    name: Minji
    slot: 1
    look: a woman in her late twenties with a short silver bob, a red wool coat and round gold glasses
    short: the woman in the red coat
    sheet: assets/A_sheet.png
    face: assets/A_face.png
    voice: assets/A_voice.wav
    voice_desc: a calm, low female voice

  - id: B
