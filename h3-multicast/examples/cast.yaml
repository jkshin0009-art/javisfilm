    sheet: assets/D_sheet.png
    face: assets/D_face.png

  - id: E
    name: Hana
    slot: 5
    look: a teenage girl with a high black ponytail, a green school blazer and a red scarf
    short: the girl in the green blazer
    sheet: assets/E_sheet.png
    face: assets/E_face.png

  - id: F
    name: Dohyun
